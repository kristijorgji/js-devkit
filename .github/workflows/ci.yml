name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm lint
      - name: Require changeset on package PRs
        if: >
          github.event_name == 'pull_request' &&
          github.head_ref != 'changeset-release/main' &&
          github.actor != 'dependabot[bot]'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^packages/'; then
            pnpm changeset status --since=origin/${{ github.base_ref }}
          else
            echo "No packages/** changes; changeset not required."
          fi

  plugin-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - eslint: '9'
            typescript: '5'
          - eslint: '10'
            typescript: '6'
    name: plugin eslint@${{ matrix.eslint }} + typescript@${{ matrix.typescript }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kristijorgji/eslint-plugin build
      - name: Install matrix peers
        working-directory: packages/eslint-plugin
        run: |
          pnpm add -D --no-lockfile eslint@${{ matrix.eslint }} typescript@${{ matrix.typescript }}
      - run: pnpm --filter @kristijorgji/eslint-plugin test

  config-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@kristijorgji/eslint-config-typescript'
          - '@kristijorgji/eslint-config-react-typescript'
    name: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ${{ matrix.package }}... build
      - run: pnpm --filter ${{ matrix.package }} test
