name: Keep Dependabot updated

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  rebase-behind:
    runs-on: ubuntu-latest
    steps:
      - name: Rebase Dependabot PRs that are behind main
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const base = context.ref.replace(/^refs\/heads\//, '');

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base,
              per_page: 100,
            });

            const dependabotPrs = pulls.filter(
              (pr) => pr.user?.login === 'dependabot[bot]',
            );

            for (const pr of dependabotPrs) {
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${base}...${pr.head.label}`,
              });

              if ((comparison.data.behind_by ?? 0) === 0) {
                console.log(`PR #${pr.number} is up to date; skipping`);
                continue;
              }

              const comments = await github.paginate(
                github.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: pr.number,
                  per_page: 100,
                },
              );

              const recentRebaseComment = comments
                .filter((c) => c.body?.trim() === '@dependabot rebase')
                .sort(
                  (a, b) =>
                    new Date(b.created_at).getTime() -
                    new Date(a.created_at).getTime(),
                )[0];

              if (recentRebaseComment) {
                const ageMs =
                  Date.now() - new Date(recentRebaseComment.created_at).getTime();
                // Avoid spamming Dependabot on rapid pushes to main.
                if (ageMs < 10 * 60 * 1000) {
                  console.log(
                    `PR #${pr.number} already has a recent rebase request; skipping`,
                  );
                  continue;
                }
              }

              console.log(
                `PR #${pr.number} is behind by ${comparison.data.behind_by}; requesting rebase`,
              );
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: '@dependabot rebase',
              });
            }
